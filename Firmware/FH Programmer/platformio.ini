; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = megaatmega2560

; The Flash Helper is an Arduino Mega 2560 R3 shield, so the firmware uploads
; over the board's own USB. There is no bootloader to install and no ISP step.
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 500000

build_flags =
  ; A PROGRAM_PAGE frame is 267 bytes and arrives in one burst. The firmware
  ; drains the ring far faster than 500 kbaud fills it, so 64 would do; 320 is
  ; cheap insurance on a part with 8 KB of RAM.
  -D SERIAL_RX_BUFFER_SIZE=320
  -Wall
  -Wextra
